---
layout: default
---
<article class="post shell-narrow">
  <header class="post-header">
    <a class="back-link" href="{{ '/writing/' | relative_url }}">Writing</a>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }}{% if page.reading_time %}, {{ page.reading_time }} min read{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-deck">{{ page.subtitle }}</p>{% endif %}
    {% if page.tags %}<p class="post-tags">{{ page.tags | join: ', ' }}</p>{% endif %}
  </header>
  <div class="post-body">{{ content }}</div>
</article>
